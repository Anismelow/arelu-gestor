spring.application.name=arelu-gestor

# Lee el .env de la raíz, arranques desde la raíz o desde backend/
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${POSTGRES_DB}

spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Login admin
app.admin.nombre-de-usuario=${ADMIN_USUARIO}
app.admin.contrasena=${ADMIN_CONTRASENA}